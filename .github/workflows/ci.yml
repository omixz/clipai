name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install fastapi "uvicorn[standard]" python-multipart stripe httpx "pyjwt[crypto]" itsdangerous \
                      faster-whisper "av>=11,<16" requests numpy pytest
      - name: Tests
        run: python -m pytest -q tests

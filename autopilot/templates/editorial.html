<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Inter'; src: url('__FONT_INTER__') format('truetype'); font-weight: 100 900; font-style: normal; }
@font-face { font-family: 'Inter'; src: url('__FONT_INTER_ITALIC__') format('truetype'); font-weight: 100 900; font-style: italic; }
@font-face { font-family: 'Instrument Serif'; src: url('__FONT_SERIF__') format('truetype'); font-style: italic; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
.scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
.scene.footage { background: radial-gradient(ellipse 70% 38% at 50% 48%, rgba(0,0,0,.42), rgba(0,0,0,0) 70%),
                               linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,0) 22%, rgba(0,0,0,0) 70%, rgba(0,0,0,.5)); }
.scene.dark { background: #0a0a0b; }
.scene.grid { background-color: #ecebe6;
  background-image: linear-gradient(#d9d7d0 1.5px, transparent 1.5px), linear-gradient(90deg, #d9d7d0 1.5px, transparent 1.5px);
  background-size: 60px 60px; }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); }
.card { position: absolute; background: #fff; box-shadow: 0 30px 70px rgba(0,0,0,.18), 0 4px 12px rgba(0,0,0,.08); }
.phone { position: absolute; width: 250px; height: 444px; border-radius: 26px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.phone .bar { position: absolute; left: 32px; height: 13px; border-radius: 7px; background: rgba(255,255,255,.92); }
.phone .badge { position: absolute; top: 18px; left: 18px; padding: 4px 12px; border-radius: 999px; background: #22c55e; color: #fff;
  font: 700 22px/1.2 'Inter'; }
.hair { position: absolute; background: rgba(255,255,255,.9); }
#text { position: absolute; left: 60px; right: 60px; top: 0; height: 1920px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding-bottom: 120px; text-align: center; }
.line { white-space: nowrap; }
.lead, .tail { font: 300 46px/1.15 'Inter'; letter-spacing: -.01em; color: #fff; }
.tail { margin-top: 4px; }
.key { font-family: 'Inter'; font-weight: 800; font-size: 150px; line-height: .95; letter-spacing: -.055em; color: #fff;
  display: inline-block; transform-origin: 50% 60%; }
.key.italic { font-style: italic; letter-spacing: -.05em; }
.key.serif { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; font-size: 178px; letter-spacing: -.02em; line-height: .9; }
.w { display: inline-block; white-space: pre; }
.onlight .lead, .onlight .tail, .onlight .key { color: #111; text-shadow: none; }
.ondark .lead, .ondark .tail, .ondark .key { text-shadow: 0 4px 40px rgba(0,0,0,.5); }
#ghost { position: absolute; left: 0; width: 1080px; top: 0; height: 1920px; display: flex; align-items: center; justify-content: center;
  padding-bottom: 120px; pointer-events: none; }
#ghost span { font-family: 'Inter'; font-weight: 800; font-size: 150px; letter-spacing: -.055em; color: #fff; white-space: nowrap; opacity: 0; }
#end { position: absolute; inset: 0; background: #0a0a0b; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 120px; }
#end .brand { font: italic 800 170px/1 'Inter'; letter-spacing: -.06em; color: #fff; }
#end .sub { font: 300 42px/1 'Inter'; color: rgba(255,255,255,.7); margin-top: 26px; letter-spacing: .01em; }
</style></head>
<body>
<div id="root">
  <div id="scenes"></div>
  <div id="ghost"><span></span></div>
  <div id="text"></div>
  <div id="end"><div class="brand"><span id="brandWord">peakcut</span><span id="brandDot">.</span></div><div class="sub" id="brandSub">link in bio</div></div>
</div>
<script>
(function () {
  const T = __TIMELINE__;
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const out3 = p => 1 - (1 - p) ** 3, inOut = p => (p < .5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2);
  const P = (t, s, d, e = out3) => e(clamp((t - s) / Math.max(1e-6, d)));
  const lerp = (a, b, p) => a + (b - a) * p;
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

  // ── generated scenes ────────────────────────────────────────────────
  const scenesEl = document.getElementById('scenes');
  const mk = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; parent.appendChild(e); return e; };
  const GRADS = ['linear-gradient(160deg,#3b2a1f,#c07a45 60%,#f2c38b)', 'linear-gradient(160deg,#0f2233,#2f6d8f 60%,#9fd3e8)',
                 'linear-gradient(160deg,#2a1830,#8a3f6b 60%,#f0a3b9)', 'linear-gradient(160deg,#16261b,#3f7a4c 60%,#bfe3a5)'];
  function phone(parent, x, y, k) {
    const p = mk('div', 'phone', parent, `left:${x}px;top:${y}px;background:${GRADS[k % 4]}`);
    mk('div', 'badge', p).textContent = String([87, 74, 91, 68][k % 4]);
    [[300, 186], [338, 150]].forEach(([top, w]) => mk('div', 'bar', p, `top:${top}px;width:${w}px`));
    return p;
  }
  const builders = {
    footage(s) { return () => {}; },
    dark(s, b) {
      const a = mk('div', 'blob', s, 'width:900px;height:900px;left:-200px;top:300px;background:#3a2414;opacity:.55');
      const c = mk('div', 'blob', s, 'width:800px;height:800px;left:420px;top:900px;background:#14283a;opacity:.6');
      return (t, lt) => { a.style.transform = `translate(${Math.sin(t * .5) * 60}px,${lt * 30}px)`; c.style.transform = `translate(${-lt * 40}px,${Math.cos(t * .4) * 50}px)`; };
    },
    grid(s, b) {
      const card = mk('div', 'card', s, 'left:300px;top:1150px;width:480px;height:330px;transform:rotate(-2deg)');
      mk('div', null, card, "position:absolute;left:28px;top:26px;font:italic 400 64px/1 'Instrument Serif';color:#111").textContent = 'the clip.';
      for (let i = 0; i < 3; i++) mk('div', null, card, `position:absolute;left:28px;top:${130 + i * 46}px;height:14px;border-radius:7px;background:#d9d7d0;width:${[400, 340, 260][i]}px`);
      const tape = mk('div', null, s, 'position:absolute;left:480px;top:1128px;width:130px;height:40px;background:rgba(255,236,170,.75);transform:rotate(-6deg)');
      return (t, lt) => { const p = P(lt, .05, .6); card.style.transform = `rotate(${lerp(-6, -2, p)}deg) translateY(${(1 - p) * 120}px)`; card.style.opacity = p; tape.style.opacity = P(lt, .35, .2); };
    },
    clips(s, b) {
      s.style.background = '#0a0a0b';
      const ps = [0, 1, 2].map(k => phone(s, 110 + k * 300, 1190, k + (b.index || 0)));
      return (t, lt) => ps.forEach((p, k) => { const q = P(lt, .1 + k * .12, .5); p.style.transform = `translateY(${(1 - q) * 260 - Math.sin(t * 1.2 + k) * 6}px) rotate(${(k - 1) * 3 * q}deg)`; p.style.opacity = q; });
    },
    wave(s, b) {
      s.style.background = '#0a0a0b';
      const bars = [], N = 48; const hot = [28, 36];
      for (let i = 0; i < N; i++) { const h = i >= hot[0] && i <= hot[1] ? 120 + rnd() * 140 : 25 + rnd() * 80; bars.push([mk('div', 'hair', s, `left:${120 + i * 17.5}px;width:3px;border-radius:2px`), h]); }
      const br = mk('div', null, s, `position:absolute;left:${120 + hot[0] * 17.5 - 22}px;width:${(hot[1] - hot[0]) * 17.5 + 47}px;top:1190px;height:300px;border:3px solid #fff;border-radius:6px;opacity:0`);
      return (t, lt) => {
        bars.forEach(([e, h], i) => { const g = P(lt, i * .008, .35) * (1 + .08 * Math.sin(t * 6 + i)); const hh = h * g; e.style.top = `${1340 - hh / 2}px`; e.style.height = `${hh}px`;
          e.style.opacity = (i >= hot[0] && i <= hot[1]) ? 1 : 1 - .7 * P(lt, .5, .3); });
        const q = P(lt, .45, .3); br.style.opacity = q; br.style.transform = `scale(${lerp(1.15, 1, q)})`;
      };
    },
    timeline(s, b) {
      s.style.background = '#0a0a0b';
      const strip = mk('div', null, s, 'position:absolute;top:1230px;left:0;height:220px;width:4000px');
      for (let i = 0; i < 26; i++) mk('div', null, strip, `position:absolute;left:${i * 150}px;top:0;width:140px;height:220px;border-radius:10px;background:${GRADS[i % 4]};opacity:.55`);
      const sel = mk('div', null, s, 'position:absolute;top:1214px;left:465px;width:150px;height:252px;border:4px solid #fff;border-radius:14px;opacity:0;box-shadow:0 0 40px rgba(255,255,255,.25)');
      const head = mk('div', 'hair', s, 'top:1180px;width:3px;height:320px;left:540px');
      return (t, lt) => { strip.style.transform = `translateX(${-lt * 260 - 200}px)`; sel.style.opacity = P(lt, .55, .25); head.style.opacity = 1 - P(lt, .55, .25); };
    },
    pc(s, b) {
      s.style.background = '#0a0a0b';
      const mon = mk('div', null, s, 'position:absolute;left:200px;top:1150px;width:680px;height:400px;border:4px solid #fff;border-radius:22px;box-shadow:0 0 80px rgba(120,160,255,.25)');
      mk('div', null, s, 'position:absolute;left:530px;top:1554px;width:20px;height:60px;background:#fff');
      const bar = mk('div', null, mon, 'position:absolute;left:80px;bottom:60px;height:8px;border-radius:4px;background:#fff;width:0');
      const ps = [0, 1, 2].map(k => mk('div', null, mon, `position:absolute;top:60px;left:${170 + k * 120}px;width:90px;height:160px;border-radius:10px;background:${GRADS[k]};opacity:0`));
      return (t, lt) => { bar.style.width = `${520 * P(lt, .1, 1.2, inOut)}px`; ps.forEach((p, k) => p.style.opacity = P(lt, .6 + k * .15, .2)); };
    },
    count(s, b) {
      s.style.background = '#0a0a0b';
      const days = ['m', 't', 'w', 't', 'f', 's', 's'].map((d, k) => {
        const box = mk('div', null, s, `position:absolute;top:1230px;left:${95 + k * 130}px;width:110px;height:196px;border:3px solid rgba(255,255,255,.85);border-radius:14px`);
        mk('div', null, s, `position:absolute;top:1440px;left:${95 + k * 130}px;width:110px;text-align:center;font:300 34px/1 'Inter';color:rgba(255,255,255,.7)`).textContent = d;
        const fill = mk('div', null, box, `position:absolute;inset:8px;border-radius:9px;background:${GRADS[k % 4]};opacity:0`);
        return fill;
      });
      return (t, lt) => days.forEach((f, k) => { const q = P(lt, .15 + k * .12, .25); f.style.opacity = q; f.style.transform = `scale(${lerp(.6, 1, q)})`; });
    },
  };

  // ── beats: scene + two-tier type ─────────────────────────────────────
  const textEl = document.getElementById('text');
  const ghost = document.querySelector('#ghost span');
  const beats = T.beats.map((b, i) => {
    const s = mk('div', 'scene ' + b.scene, scenesEl);
    b.index = i;
    const tick = (builders[b.scene] || builders.dark)(s, b);
    const block = mk('div', b.scene === 'grid' ? 'onlight' : 'ondark', textEl, 'position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:120px;opacity:0');
    const rows = { lead: mk('div', 'line lead', block), key: mk('div', 'line', block), tail: mk('div', 'line tail', block) };
    const keyEl = mk('span', 'key ' + b.style, rows.key);
    const spans = b.tokens.map(tok => {
      const parent = tok.role === 'key' ? keyEl : rows[tok.role];
      const sp = mk('span', 'w', parent); sp.textContent = tok.text + (tok.space ? ' ' : '');
      return [sp, tok];
    });
    // fit the keyword to the frame width
    requestAnimationFrame(() => {});
    return { b, s, tick, block, keyEl, spans };
  });
  function fitKeys() {
    beats.forEach(({ keyEl }) => {
      keyEl.style.fontSize = '';
      const base = parseFloat(getComputedStyle(keyEl).fontSize);
      const w = keyEl.getBoundingClientRect().width;
      if (w > 940) keyEl.style.fontSize = `${base * 940 / w}px`;
    });
  }
  document.fonts.ready.then(fitKeys);
  const endEl = document.getElementById('end');

  window.SCENE = {
    duration: T.duration, cues: T.beats.map(b => b.start), sceneDuration: T.duration, sceneCues: [],
    render(t) {
      if (!window.__fitted) { fitKeys(); window.__fitted = true; }
      beats.forEach(({ b, s, tick, block, keyEl, spans }, i) => {
        const on = t >= b.start && t < b.end;
        const lt = t - b.start;
        s.style.opacity = on ? 1 : 0;
        block.style.opacity = on ? 1 : 0;
        if (!on) return;
        tick(t, lt);
        spans.forEach(([sp, tok]) => {
          const p = P(t, tok.t, tok.role === 'key' ? .22 : .14);
          sp.style.opacity = p;
          sp.style.filter = `blur(${(1 - p) * 10}px)`;
          sp.style.transform = tok.role === 'key' ? 'none' : `translateY(${(1 - p) * 14}px)`;
        });
        const k0 = (b.tokens.find(x => x.role === 'key') || {}).t ?? b.start;
        const kp = P(t, k0, .28);
        keyEl.style.transform = `scale(${lerp(1.22, 1, kp)})`;
      });
      // ghost: the previous keyword blown up and blurred, fading behind the cut
      let gp = 0, gtext = '';
      for (let i = 1; i < T.beats.length + 1; i++) {
        const start = i < T.beats.length ? T.beats[i].start : T.end;
        if (t >= start && t < start + .45) { gp = (t - start) / .45; gtext = T.beats[i - 1].keyText; }
      }
      ghost.textContent = gtext;
      ghost.style.opacity = gtext ? .32 * (1 - gp) : 0;
      ghost.style.transform = `scale(${lerp(1.3, 3.2, out3(gp))})`;
      ghost.style.filter = `blur(${4 + gp * 22}px)`;
      // end card
      const e = P(t, T.end, .3);
      endEl.style.opacity = t >= T.end ? e : 0;
      const w = P(t, T.end + .15, .3);
      document.getElementById('brandWord').style.opacity = w;
      document.getElementById('brandWord').style.filter = `blur(${(1 - w) * 12}px)`;
      const d = P(t, T.end + .55, .25);
      document.getElementById('brandDot').style.opacity = d;
      document.getElementById('brandSub').style.opacity = P(t, T.end + .8, .4) * .9;
    },
  };
})();
</script>
</body></html>
